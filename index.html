<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIM Barcode Scanner</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 15px; background: #f4f4f9; }
        .card { background: white; padding: 15px; border-radius: 8px; max-width: 400px; margin: 10px auto; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { color: #1a365d; font-size: 1.4em; }
        h3 { font-size: 1em; color: #4b5563; text-align: left; margin-top: 0; }
        input[type="text"], input[type="file"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; margin-bottom: 8px; }
        button { width: 100%; padding: 10px; background: #1a365d; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        #reader { width: 100%; border-radius: 8px; overflow: hidden; background: #000; margin-top: 10px; display: none; }
        #result { display: none; text-align: left; margin-top: 10px; }
        .success { color: #2e7d32; font-weight: bold; }
        .error { color: #c62828; font-weight: bold; }
        #product-img { width: 100%; max-height: 250px; object-fit: contain; margin-top: 10px; border: 1px solid #ddd; border-radius: 4px; }
        .btn-link { display: block; background: #0f9d58; color: white; text-align: center; padding: 10px; border-radius: 4px; text-decoration: none; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>PIM Barcode Scanner</h1>

    <!-- 1. Handmatig Zoeken -->
    <div class="card">
        <h3>1. Handmatig Zoeken</h3>
        <input type="text" id="manualEan" placeholder="Typ EAN code...">
        <button onclick="zoekHandmatig()">🔍 Zoek</button>
    </div>

    <!-- 2. Camera Scanner -->
    <div class="card">
        <h3>2. Scannen met Camera</h3>
        <button id="camBtn" onclick="toggleCamera()">📷 Start Camera</button>
        <div id="reader"></div>
    </div>

    <!-- 3. Resultaat -->
    <div class="card" id="result">
        <h3 id="res-ean">EAN: -</h3>
        <p id="res-status"></p>
        <p id="res-path" style="font-size: 0.75em; color: gray; word-break: break-all;"></p>
        
        <!-- Afbeelding weergave -->
        <img id="product-img" src="" alt="Productfoto" style="display:none;" onerror="fotoMislukt()">
        
        <!-- Directe knop naar Google Drive voor je werkaccount -->
        <a id="drive-btn" class="btn-link" href="#" target="_blank" style="display:none;">📁 Open Foto op Google Drive</a>
    </div>

    <!-- 4. Database CSV -->
    <div class="card">
        <h3>3. Laad CSV Database</h3>
        <input type="file" id="csvFile" accept=".csv">
        <p id="db-status" style="font-size: 0.8em; color: gray;"></p>
    </div>

    <script>
        let db = {};
        let html5QrCode = null;
        let isCameraRunning = false;

        // CSV inlezen
        document.getElementById('csvFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                const lines = evt.target.result.split('\n');
                db = {};
                lines.forEach(line => {
                    const parts = line.split(';');
                    if (parts.length >= 2) {
                        const ean = parts[0].trim().replace(/"/g, '');
                        const path = parts[1].trim().replace(/"/g, '');
                        db[ean] = path;
                    }
                });
                document.getElementById('db-status').innerText = '✅ ' + Object.keys(db).length + ' producten geladen!';
            };
            reader.readAsText(file);
        });

        // Zoek & Scan Functie
        function verwerkEan(ean) {
            document.getElementById('result').style.display = 'block';
            document.getElementById('res-ean').innerText = "EAN: " + ean;

            if (db[ean]) {
                document.getElementById('res-status').className = 'success';
                document.getElementById('res-status').innerText = "✅ Product aanwezig in PIM!";
                document.getElementById('res-path').innerText = "Pad: " + db[ean];

                let bestand = db[ean];
                let imgTag = document.getElementById('product-img');
                let driveBtn = document.getElementById('drive-btn');

                // Bouw de link op voor Google Drive
                if (bestand.startsWith('http')) {
                    imgTag.src = bestand;
                    driveBtn.href = bestand;
                } else {
                    // Als het bestand een ID of pad is, zoek hem direct in jouw zakelijke Drive
                    let cleanPath = encodeURIComponent(bestand);
                    driveBtn.href = "https://drive.google.com/drive/search?q=" + cleanPath;
                    imgTag.src = "https://drive.google.com/thumbnail?authuser=0&sz=w800&id=" + bestand;
                }

                imgTag.style.display = 'block';
                driveBtn.style.display = 'block';
            } else {
                document.getElementById('res-status').className = 'error';
                document.getElementById('res-status').innerText = "❌ Niet gevonden in PIM database";
                document.getElementById('res-path').innerText = "";
                document.getElementById('product-img').style.display = 'none';
                document.getElementById('drive-btn').style.display = 'none';
            }
        }

        function zoekHandmatig() {
            const ean = document.getElementById('manualEan').value.trim();
            if (ean) verwerkEan(ean);
        }

        function fotoMislukt() {
            // Als de rechtstreekse afbeelding blokkeert door browserbeveiliging
            document.getElementById('product-img').style.display = 'none';
        }

        function toggleCamera() {
            const readerDiv = document.getElementById('reader');
            const camBtn = document.getElementById('camBtn');

            if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");

            if (isCameraRunning) {
                html5QrCode.stop().then(() => {
                    readerDiv.style.display = 'none';
                    camBtn.innerText = "📷 Start Camera";
                    isCameraRunning = false;
                });
            } else {
                readerDiv.style.display = 'block';
                html5QrCode.start(
                    { facingMode: "environment" },
                    { fps: 10, qrbox: { width: 250, height: 150 } },
                    (decodedText) => { verwerkEan(decodedText); },
                    (errorMessage) => {}
                ).then(() => {
                    camBtn.innerText = "⏹️ Stop Camera";
                    isCameraRunning = true;
                }).catch(err => {
                    alert("Cameratoestemming vereist.");
                });
            }
        }
    </script>
</body>
</html>
