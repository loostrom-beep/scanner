<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIM Barcode Scanner</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 15px; background: #f4f4f9; }
        h1 { color: #1a365d; font-size: 1.4em; }
        .box { background: white; padding: 15px; border-radius: 8px; max-width: 400px; margin: 10px auto; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        #reader { width: 100%; border-radius: 8px; overflow: hidden; background: #000; margin-top: 10px; }
        #result-card { display: none; margin-top: 15px; text-align: left; }
        #product-img { width: 100%; max-height: 250px; object-fit: contain; margin-top: 10px; border: 1px solid #ddd; border-radius: 4px; }
        .success { color: #2e7d32; font-weight: bold; }
        .error { color: #c62828; font-weight: bold; }
        button { padding: 10px 15px; background: #1a365d; color: white; border: none; border-radius: 4px; font-weight: bold; width: 100%; margin-top: 5px; cursor: pointer; }
        .drive-btn { background: #34a853; margin-top: 8px; text-decoration: none; display: block; text-align: center; color: white; padding: 8px; border-radius: 4px; font-weight: bold; }
        .search-box { display: flex; gap: 5px; margin-top: 5px; }
        .search-box input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9em; }
        .search-box button { width: auto; margin-top: 0; }
    </style>
</head>
<body>

    <h1>PIM Barcode Scanner</h1>

    <div class="box">
        <h3>1. Laad je CSV bestand</h3>
        <input type="file" id="csvFile" accept=".csv">
        <p id="db-status" style="color: gray; font-size: 0.8em; margin-top: 5px;"></p>
    </div>

    <div class="box">
        <h3>2. Handmatig zoeken</h3>
        <div class="search-box">
            <input type="text" id="manualEan" placeholder="Typ of plak EAN code...">
            <button onclick="zoekHandmatig()">Zoek</button>
        </div>
    </div>

    <div class="box">
        <h3>3. Camera Scanner</h3>
        <button onclick="startCamera()">📷 Start Camera Scanner</button>
        <div id="reader"></div>
    </div>

    <div class="box" id="result-card">
        <h3 id="ean-display">EAN: -</h3>
        <p id="status-msg"></p>
        <p id="path-display" style="font-size: 0.75em; color: gray; word-break: break-all;"></p>
        <img id="product-img" src="" alt="Productfoto" style="display:none;" onerror="afbeeldingFout()">
        <a id="drive-link" class="drive-btn" href="#" target="_blank" style="display:none;">📁 Open foto op Google Drive</a>
    </div>

    <script>
        let db = {};

        document.getElementById('csvFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                const lines = evt.target.result.split('\n');
                db = {};
                lines.forEach(line => {
                    const parts = line.split(';');
                    if (parts.length >= 2) {
                        const ean = parts[0].trim().replace(/"/g, '');
                        const path = parts[1].trim().replace(/"/g, '');
                        db[ean] = path;
                    }
                });
                document.getElementById('db-status').innerText = '✅ ' + Object.keys(db).length + ' producten geladen!';
            };
            reader.readAsText(file);
        });

        function verwerkEan(ean) {
            document.getElementById('result-card').style.display = 'block';
            document.getElementById('ean-display').innerText = "Gescand/Zocht: " + ean;

            if (db[ean]) {
                document.getElementById('status-msg').className = 'success';
                document.getElementById('status-msg').innerText = "✅ Product aanwezig in PIM!";
                document.getElementById('path-display').innerText = "Bestand: " + db[ean];

                let rawPath = db[ean];
                let imgTag = document.getElementById('product-img');
                let driveBtn = document.getElementById('drive-link');

                if (rawPath.includes('drive.google.com') || rawPath.length > 25) {
                    imgTag.src = "https://lh3.googleusercontent.com/d/" + rawPath;
                    driveBtn.href = "https://drive.google.com/file/d/" + rawPath + "/view";
                } else {
                    imgTag.src = rawPath;
                    driveBtn.href = "#";
                }

                imgTag.style.display = 'block';
                driveBtn.style.display = 'block';
            } else {
                document.getElementById('status-msg').className = 'error';
                document.getElementById('status-msg').innerText = "❌ Niet gevonden in PIM database";
                document.getElementById('path-display').innerText = "";
                document.getElementById('product-img').style.display = 'none';
                document.getElementById('drive-link').style.display = 'none';
            }
        }

        function zoekHandmatig() {
            const ean = document.getElementById('manualEan').value.trim();
            if (ean) {
                verwerkEan(ean);
            } else {
                alert("Vul eerst een EAN-code in.");
            }
        }

        function afbeeldingFout() {
            document.getElementById('product-img').style.display = 'none';
            document.getElementById('status-msg').innerText += " (Foto kon niet direct geladen worden, klik op de groene knop hieronder)";
        }

        function startCamera() {
            const html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 150 } },
                (decodedText) => { verwerkEan(decodedText); },
                (errorMessage) => {}
            ).catch(err => {
                alert("Camera kon niet starten. Zorg voor een beveiligde HTTPS verbinding en cameratoestemming.");
            });
        }
    </script>
</body>
</html>
