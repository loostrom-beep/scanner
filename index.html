<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIM Barcode Scanner</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 15px; background: #f4f4f9; }
        .card { background: white; padding: 15px; border-radius: 8px; max-width: 400px; margin: 10px auto; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { color: #1a365d; font-size: 1.4em; }
        h3 { font-size: 1em; color: #4b5563; text-align: left; margin-top: 0; }
        input[type="text"], input[type="file"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; margin-bottom: 8px; font-size: 16px; }
        button { width: 100%; padding: 12px; background: #1a365d; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 15px; }
        #reader { width: 100%; border-radius: 8px; overflow: hidden; background: #000; margin-top: 10px; display: none; }
        #result { display: none; text-align: left; margin-top: 10px; }
        .success { color: #2e7d32; font-weight: bold; }
        .error { color: #c62828; font-weight: bold; }
        
        /* Directe Afbeelding Stijl */
        .img-container { margin-top: 10px; width: 100%; min-height: 200px; display: flex; align-items: center; justify-content: center; background: #fafafa; border: 1px solid #ddd; border-radius: 6px; overflow: hidden; }
        #product-img { width: 100%; max-height: 280px; object-fit: contain; }
    </style>
</head>
<body>

    <h1>PIM Barcode Scanner</h1>

    <!-- 1. CSV Database Laden -->
    <div class="card">
        <h3>1. Laad CSV Database</h3>
        <input type="file" id="csvFile" accept=".csv">
        <p id="db-status" style="font-size: 0.8em; color: gray; margin: 0;"></p>
    </div>

    <!-- 2. Handmatig Zoeken -->
    <div class="card">
        <h3>2. Handmatig Zoeken</h3>
        <input type="text" id="manualEan" placeholder="Typ EAN code..." inputmode="numeric">
        <button onclick="zoekHandmatig()">🔍 Zoek Product</button>
    </div>

    <!-- 3. Camera Scanner -->
    <div class="card">
        <h3>3. Scannen met Camera</h3>
        <button id="camBtn" onclick="toggleCamera()">📷 Start Camera</button>
        <div id="reader"></div>
    </div>

    <!-- 4. Resultaat met Directe Afbeelding -->
    <div class="card" id="result">
        <h3 id="res-ean" style="margin-top:0;">EAN: -</h3>
        <p id="res-status" style="font-size:1.1em;"></p>
        <p id="res-path" style="font-size: 0.8em; color: #6b7280; word-break: break-all;"></p>
        
        <!-- Foto verschijnt hier direct -->
        <div class="img-container" id="img-box" style="display:none;">
            <img id="product-img" src="" alt="Productfoto" onerror="fotoMislukt()">
        </div>
    </div>

    <script>
        let db = {};
        let html5QrCode = null;
        let isCameraRunning = false;

        document.getElementById('csvFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                const lines = evt.target.result.split('\n');
                db = {};
                lines.forEach(line => {
                    const parts = line.includes(';') ? line.split(';') : line.split(',');
                    if (parts.length >= 2) {
                        const ean = parts[0].trim().replace(/"/g, '');
                        const path = parts[1].trim().replace(/"/g, '');
                        if (ean) {
                            db[ean] = path;
                        }
                    }
                });
                document.getElementById('db-status').innerText = '✅ ' + Object.keys(db).length + ' producten geladen!';
            };
            reader.readAsText(file);
        });

        function verwerkEan(ean) {
            const resCard = document.getElementById('result');
            const resStatus = document.getElementById('res-status');
            const resPath = document.getElementById('res-path');
            const imgBox = document.getElementById('img-box');
            const imgTag = document.getElementById('product-img');

            resCard.style.display = 'block';
            document.getElementById('res-ean').innerText = "Gescand/Zocht: " + ean;

            if (db[ean]) {
                resStatus.className = 'success';
                resStatus.innerText = "✅ Product aanwezig in PIM!";
                
                let origineelPad = db[ean];
                resPath.innerText = "Bestand: " + origineelPad;

                // Als het pad een directe link of ID bevat
                if (origineelPad.startsWith('http')) {
                    imgTag.src = origineelPad;
                } else {
                    // Haal de bestandsnaam of het ID op
                    let bestandsNaam = origineelPad.split('\\').pop().split('/').pop();
                    
                    // Laad de afbeelding via de directe Google Drive Webview
                    imgTag.src = "https://lh3.googleusercontent.com/d/" + bestandsNaam;
                }

                imgBox.style.display = 'flex';
                imgTag.style.display = 'block';
            } else {
                resStatus.className = 'error';
                resStatus.innerText = "❌ Niet gevonden in PIM database";
                resPath.innerText = "";
                imgBox.style.display = 'none';
            }
        }

        function fotoMislukt() {
            // Fallback voor als de directe link geblokkeerd wordt
            const imgTag = document.getElementById('product-img');
            let origineelPad = db[document.getElementById('manualEan').value.trim()] || "";
            let bestandsNaam = origineelPad.split('\\').pop().split('/').pop();
            
            // Probeer alternatieve thumbnail weergave
            imgTag.src = "https://drive.google.com/thumbnail?sz=w800&id=" + bestandsNaam;
        }

        function zoekHandmatig() {
            const ean = document.getElementById('manualEan').value.trim();
            if (ean) verwerkEan(ean);
        }

        function toggleCamera() {
            const readerDiv = document.getElementById('reader');
            const camBtn = document.getElementById('camBtn');

            if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");

            if (isCameraRunning) {
                html5QrCode.stop().then(() => {
                    readerDiv.style.display = 'none';
                    camBtn.innerText = "📷 Start Camera";
                    isCameraRunning = false;
                });
            } else {
                readerDiv.style.display = 'block';
                html5QrCode.start(
                    { facingMode: "environment" },
                    { fps: 10, qrbox: { width: 250, height: 150 } },
                    (decodedText) => { verwerkEan(decodedText); },
                    (errorMessage) => {}
                ).then(() => {
                    camBtn.innerText = "⏹️ Stop Camera";
                    isCameraRunning = true;
                }).catch(err => {
                    alert("Cameratoestemming vereist.");
                });
            }
        }
    </script>
</body>
</html>
