<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIM Scanner Test</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 15px; background: #f0f0f0; }
        .card { background: white; padding: 15px; border-radius: 8px; max-width: 400px; margin: 10px auto; text-align: left; }
        input, button { width: 100%; padding: 12px; margin-top: 5px; box-sizing: border-box; }
        #reader { width: 100%; margin-top: 10px; display: none; }
        .success { color: green; font-weight: bold; }
        .error { color: red; font-weight: bold; }
        pre { background: #eee; padding: 10px; font-size: 11px; white-space: pre-wrap; word-break: break-all; }
    </style>
</head>
<body>

    <h2>PIM Test Scanner</h2>

    <div class="card">
        <b>1. Laad CSV</b>
        <input type="file" id="csvFile" accept=".csv">
        <p id="db-status" style="font-size: 12px; color: gray;"></p>
    </div>

    <div class="card">
        <b>2. Zoek of Scan</b>
        <input type="text" id="manualEan" placeholder="Typ EAN...">
        <button onclick="zoek()">Zoek EAN</button>
        <button onclick="toggleCam()" style="background:#1a365d; color:white;">Start Camera</button>
        <div id="reader"></div>
    </div>

    <div class="card" id="result" style="display:none;">
        <h3 id="res-ean"></h3>
        <p id="res-status"></p>
        <p><b>Tekst in jouw CSV:</b></p>
        <pre id="res-raw"></pre>
    </div>

    <script>
        let db = {};
        let html5QrCode = null;

        document.getElementById('csvFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                const lines = evt.target.result.split('\n');
                db = {};
                lines.forEach(line => {
                    const parts = line.includes(';') ? line.split(';') : line.split(',');
                    if (parts.length >= 2) {
                        const ean = parts[0].trim().replace(/"/g, '');
                        const path = parts[1].trim().replace(/"/g, '');
                        if (ean) db[ean] = path;
                    }
                });
                document.getElementById('db-status').innerText = Object.keys(db).length + ' producten geladen.';
            };
            reader.readAsText(file);
        });

        function verwerk(ean) {
            document.getElementById('result').style.display = 'block';
            document.getElementById('res-ean').innerText = "EAN: " + ean;
            if (db[ean]) {
                document.getElementById('res-status').className = 'success';
                document.getElementById('res-status').innerText = "✅ Product gevonden in CSV";
                document.getElementById('res-raw').innerText = db[ean];
            } else {
                document.getElementById('res-status').className = 'error';
                document.getElementById('res-status').innerText = "❌ Niet gevonden";
                document.getElementById('res-raw').innerText = "-";
            }
        }

        function zoek() {
            const val = document.getElementById('manualEan').value.trim();
            if (val) verwerk(val);
        }

        function toggleCam() {
            const r = document.getElementById('reader');
            r.style.display = 'block';
            if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 150 } },
                (text) => { verwerk(text); }
            ).catch(err => alert("Camera fout"));
        }
    </script>
</body>
</html>
