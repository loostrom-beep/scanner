<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIM Barcode Scanner</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: sans-serif; text-align: center; margin: 0; padding: 15px; background: #f4f4f9; }
        .card { background: white; padding: 15px; border-radius: 8px; max-width: 400px; margin: 10px auto; text-align: left; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1 { color: #1a365d; text-align: center; font-size: 1.3em; }
        input, button { width: 100%; padding: 12px; margin-top: 5px; box-sizing: border-box; font-size: 15px; }
        button { background: #1a365d; color: white; border: none; border-radius: 4px; font-weight: bold; }
        #reader { width: 100%; margin-top: 10px; display: none; }
        .success { color: green; font-weight: bold; }
        .error { color: red; font-weight: bold; }
        .drive-btn { display: block; background: #16a34a; color: white !important; text-align: center; padding: 15px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 16px; margin-top: 12px; }
    </style>
</head>
<body>

    <h1>PIM Barcode Scanner</h1>

    <div class="card">
        <b>1. Laad CSV Database</b>
        <input type="file" id="csvFile" accept=".csv">
        <p id="db-status" style="font-size: 12px; color: gray; margin: 5px 0 0 0;"></p>
    </div>

    <div class="card">
        <b>2. Handmatig Zoeken</b>
        <input type="text" id="manualEan" placeholder="Typ EAN code..." inputmode="numeric">
        <button onclick="zoekHandmatig()">🔍 Zoek Product</button>
    </div>

    <div class="card">
        <b>3. Scannen met Camera</b>
        <button onclick="toggleCamera()">📷 Start Camera</button>
        <div id="reader"></div>
    </div>

    <div class="card" id="result" style="display:none;">
        <h3 id="res-ean" style="margin:0;"></h3>
        <p id="res-status" style="margin: 10px 0;"></p>
        <p id="res-path" style="font-size: 11px; color: gray; word-break: break-all; margin: 0;"></p>
        
        <a id="drive-link" class="drive-btn" href="#" target="_blank" style="display:none;">📁 Open Foto op Google Drive</a>
    </div>

    <script>
        let db = {};
        let html5QrCode = null;

        document.getElementById('csvFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                const lines = evt.target.result.split('\n');
                db = {};
                lines.forEach(line => {
                    const parts = line.includes(';') ? line.split(';') : line.split(',');
                    if (parts.length >= 2) {
                        const ean = parts[0].trim().replace(/"/g, '');
                        const path = parts[1].trim().replace(/"/g, '');
                        if (ean) db[ean] = path;
                    }
                });
                document.getElementById('db-status').innerText = '✅ ' + Object.keys(db).length + ' producten geladen!';
            };
            reader.readAsText(file);
        });

        function verwerkEan(ean) {
            document.getElementById('result').style.display = 'block';
            document.getElementById('res-ean').innerText = "Gescand: " + ean;

            if (db[ean]) {
                document.getElementById('res-status').className = 'success';
                document.getElementById('res-status').innerText = "✅ Product aanwezig in PIM!";
                
                let rawPath = db[ean];
                document.getElementById('res-path').innerText = "Bestand: " + rawPath;

                // Stript '40 BABYVOEDING\IMAGES\' en pakt alleen de bestandsnaam '8713500011897.1'
                let bestandsNaam = rawPath.replace(/\\/g, '/').split('/').pop();

                // Maak de link aan voor Google Drive
                let btn = document.getElementById('drive-link');
                btn.href = "https://drive.google.com/drive/search?q=" + encodeURIComponent(bestandsNaam);
                btn.style.display = 'block';
            } else {
                document.getElementById('res-status').className = 'error';
                document.getElementById('res-status').innerText = "❌ Niet gevonden in PIM";
                document.getElementById('res-path').innerText = "";
                document.getElementById('drive-link').style.display = 'none';
            }
        }

        function zoekHandmatig() {
            const val = document.getElementById('manualEan').value.trim();
            if (val) verwerkEan(val);
        }

        function toggleCamera() {
            const r = document.getElementById('reader');
            r.style.display = 'block';
            if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 150 } },
                (text) => { verwerkEan(text); }
            ).catch(err => alert("Cameratoestemming vereist."));
        }
    </script>
</body>
</html>
